name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install -g cordova@12
      - run: sh build-www.sh app
      - name: Plataforma e plugins
        run: |
          cordova platform add android@13
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-x-socialsharing
          cordova plugin add ./plugins-local/cordova-plugin-live-rtmp
            - run: |
          echo "cdvCompileSdkVersion=34" >> platforms/android/gradle.properties
          echo "android.useAndroidX=true" >> platforms/android/gradle.properties
          echo "android.enableJetifier=true" >> platforms/android/gradle.properties
          sed -i 's/androidx.appcompat:appcompat:1.6.1/androidx.appcompat:appcompat:1.7.0/g' platforms/android/app/build.gradle platforms/android/CordovaLib/build.gradle 2>/dev/null || true
        
      - run: cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: live-vtuber-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
